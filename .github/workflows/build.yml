name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # WPF on .NET Framework 4.7.2 needs full MSBuild and the Windows SDK, so this cannot
    # run on a Linux runner.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The backlog's phases must stay workable in order. A requirement whose acceptance
      # criteria depend on a later phase makes its own phase unclosable, which is how Phase 1
      # came to be declared complete with 37 Phase 0 issues open. Cheap to check, and it only
      # ever regresses through a specification edit, so it runs before the build.
      # --check, not a plain run: the register is a generated file that is COMMITTED, and
      # regenerating it here only ever checked the runner's throwaway copy. The committed one
      # drifted 83 lines from the specification, for weeks, including an acceptance-criterion
      # edit -- and create_issues.py and sync_issues.py build the backlog from the committed one.
      - name: Check delivery phases are self-contained
        run: |
          python tools/parse_requirements.py --check
          python tools/check_phase_atomicity.py

      # REQ-NFR-008. Cheap, and it only regresses through an edit to a project file or to the
      # register, so it runs before the build rather than after it.
      - name: Check the dependency register
        run: python tools/check_dependencies.py

      # Build-file mistakes that have each already cost a red CI run: a pinned C++ toolset, a
      # .vcxproj in the solution the dotnet CLI cannot evaluate, and two output trees for one
      # project. None is visible in review unless the reviewer knows the rule.
      - name: Check the project files
        run: python tools/check_project_files.py

      # REQ-TST-001: "a DSP primitive with no closed-form test fails the build rather than passing
      # untested, so the table is a floor and not a sample". The table lives in the specification
      # and is read from it, so a component added there without a test fails here.
      - name: Check REQ-TST-001's primitive coverage
        run: python tools/check_primitive_coverage.py

      - name: Restore
        run: msbuild OpenVSA.slnx /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build
        run: msbuild OpenVSA.slnx /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Test
        run: dotnet test OpenVSA.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      # REQ-ARC-001. The architecture tests assert that no analysis assembly *names* a transport,
      # which is weaker than it looks: an assembly can avoid a compile-time reference and still be
      # unbuildable without one, through a shared build property, a copied plug-in, or a fixture
      # that quietly needs a real source. Building without them is what settles it.
      - name: Build the analysis stack with no front end present
        run: pwsh tools/build_without_front_ends.ps1 -Configuration Release

      # REQ-TST-007, and the shared criterion of every one of REQ-NFR-020..026: the harness runs
      # in CI and fails the build on a >15 % regression against a stored baseline.
      #
      # Two of the targets need a real desktop — twenty top-level windows, and a shell launched and
      # driven through UI Automation — so this cannot move to a container. It runs Release x64
      # because a Debug measurement is not a measurement.
      #
      # On a runner the machine class will not match any stored baseline, so the gate records the
      # figures and does not judge them: the targets are stated for the reference machine and
      # comparing across machine classes fires on the hardware rather than on the change. What CI
      # still catches, and what nothing else does, is a target that has stopped being measured at
      # all — the harness may not quietly shrink to whatever happens to work.
      - name: Performance gate
        run: |
          # Found rather than hard-coded. The output directory is bin\x64\Release\net472 here and
          # bin\Release\net472 elsewhere depending on how the platform is resolved, and guessing it
          # produced a step that failed with "no benchmark host at ..." while the binary sat one
          # directory away. Searching states plainly what it found.
          $exe = Get-ChildItem -Path .\tests\OpenVSA.Benchmarks -Recurse -Filter OpenVSA.Benchmarks.exe |
                 Where-Object { $_.FullName -match '\\Release\\' } |
                 Sort-Object LastWriteTime -Descending |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Get-ChildItem -Path .\tests\OpenVSA.Benchmarks -Recurse -Filter *.exe | ForEach-Object { $_.FullName }
            throw "no Release build of the benchmark host"
          }
          Write-Output "harness: $exe"
          & $exe --gate --measure --measurements "$env:RUNNER_TEMP\measurements.tsv"
          if ($LASTEXITCODE -ne 0) { throw "the harness could not take its measurements" }
          & $exe --gate --measurements "$env:RUNNER_TEMP\measurements.tsv"
          exit $LASTEXITCODE

      - name: Publish performance figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-measurements
          path: ${{ runner.temp }}/measurements.tsv
          if-no-files-found: warn

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
